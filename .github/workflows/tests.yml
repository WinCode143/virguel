name: Tests

on:
  push:
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: virguel
          POSTGRES_USER: virguel
          POSTGRES_PASSWORD: virguel
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U virguel" --health-interval 5s --health-retries 10
    env:
      DJANGO_DEBUG: "1"
      POSTGRES_DB: virguel
      POSTGRES_USER: virguel
      POSTGRES_PASSWORD: virguel
      POSTGRES_HOST: localhost
      POSTGRES_PORT: "5432"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python manage.py makemigrations --check --dry-run
      - run: python manage.py test
