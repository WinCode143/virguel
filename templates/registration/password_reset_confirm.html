{% extends "registration/cuenta_base.html" %}
{% block tarjeta %}<h1 style="font-size:1.2rem;margin-bottom:.8rem">Elegí tu clave nueva</h1>
{% if validlink %}<form method="post">{% csrf_token %}
{% for f in form %}<label for="{{ f.id_for_label }}">{{ f.label }}</label>{{ f }}{% for e in f.errors %}<p class="errorlist" style="margin-top:-.6rem">{{ e }}</p>{% endfor %}{% endfor %}
<button class="btn">Guardar clave</button></form>
{% else %}<p class="estado critico">El link ya se usó o venció.</p><p style="margin-top:1rem"><a href="{% url 'password_reset' %}">Pedir otro</a></p>{% endif %}{% endblock %}
